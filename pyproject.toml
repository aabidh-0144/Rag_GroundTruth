[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth"
version = "0.1.0"
description = "Automated evaluation and regression-testing framework for RAG systems"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = [
    "live: calls a real local judge LLM; skipped unless GROUNDTRUTH_LIVE_TESTS=1",
]
filterwarnings = [
    # Raised inside Ragas' own imports (ragas.llms.base), not by this project.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]
