# Experiment A -- dense/vector retrieval only.
name: dense

chunking:
  size: 512
  overlap: 64
  min_tokens: 80

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32

retrieval:
  strategy: dense
  k: 10

generation:
  provider: ollama
  model: qwen3:4b
  context_chunks: 5
  temperature: 0.0
  seed: 42
  num_ctx: 4096
