# Experiment D -- hybrid retrieval with the larger, stronger cross-encoder.
# Same pipeline as Experiment C; isolates reranker capacity as the single variable.
name: hybrid_rerank_large

chunking:
  size: 512
  overlap: 64
  min_tokens: 80

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32

retrieval:
  strategy: hybrid_rerank
  k: 10
  candidates:
    dense: 50
    sparse: 50
  fusion:
    method: rrf
    k: 60
  reranker:
    # ~29s/query for 50 candidates on this CPU -- expect ~48min per 100-question run.
    model: BAAI/bge-reranker-base
    top_n: 50
    max_length: 512

generation:
  provider: ollama
  model: qwen3:4b
  context_chunks: 5
  temperature: 0.0
  seed: 42
  num_ctx: 4096
